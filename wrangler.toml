# Static Astro site — do not auto-add @astrojs/cloudflare (keeps output in dist/).
name = "cheatswarthunder-net"
main = "worker/canonical-host.mjs"
compatibility_date = "2025-10-11"

# Cloudflare CI runs `npx wrangler deploy` only; this produces dist/ before upload.
[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"
html_handling = "none"
